name: Publish SDK to NPM

on:
  release:
    types: [published]

# Provenance/OIDC: permite firmar el paquete con sigstore (npm publish --provenance)
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          # setup-node crea automáticamente un .npmrc que lee NODE_AUTH_TOKEN

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Check package content (dry-run)
        run: npm pack --dry-run

      - name: Verify version not already published
        # Evita el error si la versión ya existe en NPM (npm no permite republicar)
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null || echo "not_found")
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "Version $PKG_VERSION already published — skipping publish."
            echo "SKIP_PUBLISH=true" >> $GITHUB_ENV
          else
            echo "Version $PKG_VERSION is new — proceeding with publish."
            echo "SKIP_PUBLISH=false" >> $GITHUB_ENV
          fi

      - name: Publish to NPM
        if: env.SKIP_PUBLISH == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
